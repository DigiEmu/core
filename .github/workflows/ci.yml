name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Go fmt + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        shell: bash
        run: |
          set -euo pipefail
          # gofmt should not modify tracked files in CI
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "gofmt would modify:"
            echo "$files"
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: Phase 4 acceptance (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File .\scripts\accept_phase4.ps1
