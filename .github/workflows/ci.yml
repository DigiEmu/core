name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    name: Go Tests (Repro Gate)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: |
          go test ./...
